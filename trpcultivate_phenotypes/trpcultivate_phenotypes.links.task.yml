# Tabs/task items - Configuring Tripal Cultivate Phenotypes.
# Order as they appear.

trpcultivate_phenotypes.tab1:
  title: 'Ontology Configuration'
  route_name: 'trpcultivate_phenotypes.settings_ontology'
  base_route: 'trpcultivate_phenotypes.settings_ontology'
  weight: 1

trpcultivate_phenotypes.tab2:
  title: 'Integration Configuration'
  route_name: 'trpcultivate_phenotypes.settings_integration'
  base_route: 'trpcultivate_phenotypes.settings_ontology'
  weight: 2

trpcultivate_phenotypes.tab3:
  title: 'Watermark Configuration'
  route_name: 'trpcultivate_phenotypes.settings_watermark'
  base_route: 'trpcultivate_phenotypes.settings_ontology'
  weight: 3

trpcultivate_phenotypes.tab4:
  title: 'R Configuration'
  route_name: 'trpcultivate_phenotypes.settings_r'
  base_route: 'trpcultivate_phenotypes.settings_ontology'
  weight: 4

# Create a tab titled Phenotypes in a Research Experiment content type.
trpcultivate_phenotypes.tab_phenotypes:
  route_name: 'trpcultivate_phenotypes.experiment_configuration'
  title: 'Phenotypes'
  base_route: 'entity.tripal_entity.canonical'

# Create a tab titled Backup in a Research Experiment content type.
trpcultivate_phenotypes.tab_backup:
  route_name: 'trpcultivate_phenotypes.experiment_phenobackup'
  title: 'Phenotypes Backup'
  base_route: 'entity.tripal_entity.canonical'
