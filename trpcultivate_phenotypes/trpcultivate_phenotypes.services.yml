# TripalCultivate Phenotypes Services.
services:
  trpcultivate_phenotypes.terms:
    class: 'Drupal\trpcultivate_phenotypes\Service\TripalCultivatePhenotypesTermsService'
    arguments: ['@config.factory', '@tripal.logger', '@tripal_chado.chado_buddy']

  trpcultivate_phenotypes.genus_ontology:
    class: 'Drupal\trpcultivate_phenotypes\Service\TripalCultivatePhenotypesGenusOntologyService'
    arguments: ['@config.factory', '@tripal_chado.database', '@tripal.logger']

  trpcultivate_phenotypes.genus_project:
    class: 'Drupal\trpcultivate_phenotypes\Service\TripalCultivatePhenotypesGenusProjectService'
    arguments: ['@config.factory', '@tripal_chado.database', '@tripal.logger']

  trpcultivate_phenotypes.traits:
    class: 'Drupal\trpcultivate_phenotypes\Service\TripalCultivatePhenotypesTraitsService'
    arguments: ['@trpcultivate_phenotypes.genus_ontology', '@trpcultivate_phenotypes.terms', '@tripal_chado.database', '@tripal_chado.chado_buddy']

  trpcultivate_phenotypes.pheno_experiment_configuration_access_check:
    class: 'Drupal\trpcultivate_phenotypes\Access\PhenoExperimentConfigurationAccessCheck'
    arguments: []
    tags:
      - { name: 'access_check', applies_to: '_pheno_experiment_configuration_access_check' }

  trpcultivate_phenotypes.hooks:
    class: 'Drupal\trpcultivate_phenotypes\Hook\TripalCultivatePhenotypesHooks'
  trpcultivate_phenotypes.theme_hooks:
    class: 'Drupal\trpcultivate_phenotypes\Hook\TripalCultivatePhenotypesThemeHooks'
  trpcultivate_phenotypes.alter_hooks:
    class: 'Drupal\trpcultivate_phenotypes\Hook\TripalCultivatePhenotypesAlterHooks'
    arguments: ['@current_route_match', '@database']
