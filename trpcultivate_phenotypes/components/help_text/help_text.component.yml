name: help_text
props:
  type: object
  required:
    - label
    - help_text
  properties:
    label:
      type: string
      title: Help label.
      description: The text that precedes the help icon.
    help_text:
      type: string
      title: Help text to show on mouse over.
      description: The help/tip text that will appear on mouse over.
    link_to:
      type: string
      title: Page to link.
      description: The page address to link on mouse click.
