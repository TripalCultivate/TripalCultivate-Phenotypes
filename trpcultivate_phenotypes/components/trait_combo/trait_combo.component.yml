name: trait_combo
props:
  type: object
  required:
    - method_unit_combo
    - multiselect_method
  properties:
    multiselect_method:
      type: boolean
      title: Multi-select method.
      description: Indicate that a trait will list all available methods.
    name:
      type: string
      title: Trait name.
      description: The trait name.
    definition:
      type: string
      title: Trait definition.
      description: The trait definition.
    method_unit_combo:
      type: array
      title: Method - Unit combo.
      description: Method, unit, type and colleciton method information.
    status:
      type: object
      title: Trait status
      description: The status (is required, was shared, was collected and is archived) of a trait in an experiment.
    trait_id:
      type: integer
      title: Trait id number.
      description: The trait id number (Trait) used to reference associated field element keyed with the trait id .
