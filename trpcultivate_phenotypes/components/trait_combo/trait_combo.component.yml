name: trait_combo
props:
  type: object
  required:
    - name
    - definition
    - method_unit_combo
    - multiselect_method
  properties:
    multiselect_method:
      type: boolean
      title: Multi-select method.
      description: Indicate that a trait will list all available methods.
    name:
      type: string
      title: Trait name.
      description: The trait name.
    definition:
      type: string
      title: Trait definition.
      description: The trait definition.
    method_unit_combo:
      type: array
      title: Method - Unit combo.
      description: Method, unit, type and colleciton method information.
    status:
      type: array
      title: Trait status
      description: The status (is required, was shared, was collected and is archived) of a trait in an experiment.
slots:
  controls:
    type: array
    title: Field controls.
    description: Field elements to control a trait method.
