name: icon_text
props:
  type: object
  required:
    - icon_name
  properties:
    icon_name:
      type: string
      title: The name of the icon to display.
      description: The name of the icon that corresponds to an icon template to display.
    link_to:
      type: string
      title: Hypertext Reference.
      description: The href value of the link if the icon links to another page.
    label:
      type: string
      title: Help label.
      description: The text that precedes the help icon.
