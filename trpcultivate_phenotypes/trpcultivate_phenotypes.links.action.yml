entity.phenodata_backup.add_form:
  route_name: 'entity.phenodata_backup.add_form'
  title: 'Backup Phenotypic Data'
  appears_on:
    - 'entity.phenodata_backup.collection'

trpcultivate_phenotypes.trait_selector:
  route_name: 'trpcultivate_phenotypes.experiment_traitselector'
  title: 'Add Trait'
  appears_on:
    - 'trpcultivate_phenotypes.experiment_configuration'
  options:
    attributes:
      class:
        - 'use-ajax'
      data-dialog-type: 'modal'
      data-dialog-options: '{"width": 850}'

trpcultivate_phenotypes.exp_backupfile:
  route_name: 'entity.phenodata_backup.add_form'
  title: 'Backup a File'
  appears_on:
    - 'trpcultivate_phenotypes.experiment_phenobackup'
  options:
    attributes:
      target: '_blank'
