# Tripal Cultivate Phenotypes Configuration/Settings.

# NOTE: reserved configuration for Phenotypes share and collect module
# specific configuration variables.
langcode: 'en'

trpcultivate:
  phenotypes:
    # trpcultivate.directory:
    # Directory structure to house file imported and generated by phenotypes
    # modules. Base path: public://TripalCultivatePhenotypes/
    directory:
      watermark: 'public://TripalCultivatePhenotypes/watermark/'
      data_file: 'public://TripalCultivatePhenotypes/data_collection/'
      data_backup: 'public://phenotype-backups/'
      data_env: 'public://TripalCultivatePhenotypes/data_env/'
      trait_photo: ''

    # trpcultivate.phenotypes.r_config:
    # Configurations relating to rules to apply when transforming trait names
    # to R-compatible version. Separate each rule with comma character (CSV).
    # - words: words to find and remove.
    # - chars: special characters to find and remove.
    # - replace: search key = replace with (search and replace).
    r_config:
      words:
        - 'of'
        - 'to'
        - 'have'
        - 'on'
        - 'at'
      chars:
        - '('
        - ')'
        - '/'
        - '-'
        - ':'
        - ';'
        - '%'
      replace:
        - '# = num'
        - '/ = div'
        - '? = unsure'
        - '- = to'

    # trpcultivate.phenotypes.watermark:
    # Configurations relating to the watermarking of charts.
    # - charts: True, all charts will be watermarked and False, otherwise.
    # - image: File path to watermark image. See directories for base path.
    watermark:
      charts: false
      image: ''
      file_ext:
        - 'png'
        - 'gif'

    # trpcultivate.phenotypes.ontology:
    # Configure vocabulary term, database and term used by many processes of phenotypes module.
    # - terms: terms used when inserting phenotypic data.
    # - cvdbon: CV, Database and Ontology used to house traits.
    ontology:
      terms:
        data_collector: 0
        sample_entry: 0
        genus: 0
        experiment_group: 0
        germplasm_name: 0
        experiment_container: 0
        unit_to_method_relationship_type: 0
        method_to_trait_relationship_type: 0
        trait_to_synonym_relationship_type: 0
        unit_type: 0
        experiment_replicate: 0
        experiment_timepoint: 0
        experiment_treatment: 0
      cvdbon:
      allownew: true

    # trpcultivate.phenotypes.pheno_backup_support:
    # List of bundle entity names that support phenotypes backup functionality.
    # Default entry: research_experiment
    pheno_backup_support:
      - 'research_experiment'

    # trpcultivate.phenotypes.pheno_backup_support:
    # List of bundle entity names that support setting up of phenotypes trait combinations.
    # Default entry: research_experiment
    pheno_combo_support:
      - 'research_experiment'

  phenoshare: null
  phenocollect: null

  # Default terms used to create relationship and metadata.
  # Values are configurable via the ontology configuration page and values
  # set below are default upon installation.
  default_terms:
    term_set:
      -
        name: taxonomic_rank
        definition: 'A vocabulary of taxonomic ranks (species, family, phylum, etc).'
        terms:
          -
            config_map: genus
            id: TAXRANK:0000005
            name: genus
            definition: 'The genus'
            help_text: 'This term indicates that a given property is the associated "genus". For example, this module save experiments producing phenotypic data as projects and the organism that experiment assays is indicated by adding a "genus" property to it.'
      -
        name: uo
        definition: 'Units of Measurement Ontology.'
        terms:
          -
            config_map: unit_to_method_relationship_type
            id: UO:0000000
            name: unit
            definition: 'Unit of measurement'
            help_text: 'This term describes the relationship between your method and the unit with which it was measured.'
      -
        name: ncit
        definition: 'NCI Thesaurus OBO Edition'
        terms:
          -
            config_map: method_to_trait_relationship_type
            id: NCIT:C71460
            name: method
            definition: 'A means, manner of procedure, or systematic course of action that have to be performed in order to accomplish a particular goal.'
            help_text: 'This term describes the relationship between your trait vocabulary and the method with which the data was taken.'
          -
            config_map: trait_to_synonym_relationship_type
            id: NCIT:C71887
            name: Preferred Term
            definition: 'A descriptive word or phrase selected as an authorized descriptor to represent a discrete concept.'
            help_text: 'This term describes the relationship between your trait and a related term in a published ontology such as the Trait Ontology or a crop-specific ontology.'
          -
            config_map: experiment_replicate
            id: NCIT:C28038
            name: replicate
            definition: 'To make a copy or duplicate of something.'
            help_text: 'The number indicating the replicate of the sample.'
          -
            config_map: data_collector
            id: NCIT:C45262
            name: 'Collected By'
            definition: 'Indicates the person, group, or institution who performed the collection act.'
            help_text: 'Metadata tagged with this term indicates the name of the person who collected the phenotypic measurement.'
          -
            config_map: sample_entry
            id: NCIT:C43381
            name: Entry
            definition: 'An item inserted in a written or electronic record.'
            help_text: 'A unique identifier or label of the plant material being measured. For example, the germplasm entry number or the seed packet label.'
          -
            config_map: germplasm_name
            id: NCIT:C42614
            name: name
            definition: 'The words or language units by which a thing is known.'
            help_text: 'The official name of the accession phenotyped. This accession name should be an exact match of an accession previously imported using a Germplasm Importer.'
          -
            config_map: experiment_container
            id: NCIT:C210102
            name: Sample Type
            definition: 'A characterization or classification of the sample.'
            help_text: 'The identifier for the physical entity (e.g. plot, plant, protein extraction) that measurements are being taken on. For example, the plot identifier in a field experiment or the test tube label in a biochemical assay.'
          -
            config_map: experiment_timepoint
            id: NCIT:C68568
            name: Timepoint
            definition: 'A specific point in the time continuum, including those established relative to an event.'
            help_text: 'The most specific timepoint common to all measurements recorded on a single row in the file. For example, if the measurements are days to various growth stages then this might be the planting date. Alternatively, if the measurements are all relating to specific biochemical assay run or drone flyover then the assay date or drone flyover date would be used in order to keep the rows of the file unique.'
      -
        name: AGRO
        definition: 'Agronimic Ontology'
        terms:
          -
            config_map: experiment_treatment
            id: AGRO:00000322
            name: treatment
            definition: 'A process during which some material is applied to a subject'
            help_text: 'Refers to specific condition or manipulation that is applied. For example, fertilizer, weeding pressure, nitrogen supplementation, or temperature.'
      -
        name: schema
        definition: 'Schema.org is sponsored by Google, Microsoft, Yahoo and Yandex. The vocabularies are developed by open community process.'
        terms:
          -
            config_map: unit_type
            id: schema:additionalType
            name: additionalType
            definition: 'Supplemental data type attached to a unit (ie. quantitative or qualitative).'
            help_text: 'Metadata tagged with this term indicates the data type of a unit of measurement.'
      -
        name: EFO
        definition: Experimental Factor Ontology (EFO).
        terms:
          -
            config_map: experiment_group
            id: EFO:0005067
            name: block
            definition: 'A block or batch is an experimental unit arrangement into a group which is similar to one another. Typically, a blocking factor is a source of variability that is not of primary interest to the experimenter. An example of a blocking factor might be the sex of a patient; by blocking on sex, this source of variability is controlled for, thus leading to greater accuracy.'
            help_text: 'A simple descriptor of the environmental variables for this particular grouping of experimental subjects or germplasm. For example, site location, heated vs. room temperature, or assay.'
