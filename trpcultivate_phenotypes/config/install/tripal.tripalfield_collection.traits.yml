id: 'traits'
label: 'Tripal Cultivate: Phenotypic data'
description: 'Provide pages describing phenotypic traits. These pages should be imported via the Tripal Cultivate Phenotypic Trait Importer.'
fields:

    -   name: trait_name
        content_type: trait
        label: Name
        type: chado_string_type_default
        description: "The name of the phenotypic trait (e.g. Days till Maturity)."
        cardinality: 1
        required: true
        storage_settings:
            storage_plugin_id: chado_storage
            storage_plugin_settings:
                base_table: cvterm
                base_column: name
            max_length: 255
        settings:
            termIdSpace: schema
            termAccession: "name"
        display:
            view:
                default:
                    region: hidden
                    label: hidden
                    weight: 10
            form:
                default:
                    region: content
                    weight: 10

    -   name: trait_definition
        content_type: trait
        label: Definition
        type: chado_text_type_default
        description: "A full definition of the phenotypic trait."
        cardinality: 1
        required: true
        storage_settings:
            storage_plugin_id: chado_storage
            storage_plugin_settings:
                base_table: cvterm
                base_column: name
            max_length: 255
        settings:
            termIdSpace: IAO
            termAccession: "0000115"
        display:
            view:
                default:
                  region: content
                  label: hidden
                  weight: 0
            form:
                default:
                    region: content
                    weight: 12

    -   name: trait_cv
        content_type: trait
        label: "Controlled Vocabulary"
        type: chado_integer_type_default
        description: "The controlled vocabulary this trait is part of."
        cardinality: 1
        required: true
        storage_settings:
            storage_plugin_id: chado_storage
            storage_plugin_settings:
                base_table: cvterm
                base_column: cv_id
        settings:
            termIdSpace: NCIT
            termAccession: "C48697"
        display:
          view:
            default:
              region: hidden
              label: hidden
              weight: 14
          form:
            default:
              region: content
              weight: 14
