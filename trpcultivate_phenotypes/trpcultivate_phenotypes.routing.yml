# Routes for configuring Tripal Cultivate Phenotypes.
# Configuration dashboard.
trpcultivate_phenotypes.settings:
  path: 'admin/tripal/extension/tripal-cultivate/phenotypes'
  defaults:
    _title: 'Configure Tripal Cultivate Phenotypes'
    _controller: '\Drupal\trpcultivate_phenotypes\Controller\TripalCultivatePhenotypesSettingsController:loadPage'
  requirements:
    _permission: 'administer tripal'

# Configuration: R Transformation Rules.
trpcultivate_phenotypes.settings_r:
  path: 'admin/tripal/extension/tripal-cultivate/phenotypes/r-rules'
  defaults:
    _title: 'Configure Tripal Cultivate Phenotypes: R Transformation Rules'
    _form: '\Drupal\trpcultivate_phenotypes\Form\TripalCultivatePhenotypesRSettingsForm'
  requirements:
    _permission: 'administer tripal'

# Configuration: Watermark Charts.
trpcultivate_phenotypes.settings_watermark:
  path: 'admin/tripal/extension/tripal-cultivate/phenotypes/watermark'
  defaults:
    _title: 'Configure Tripal Cultivate Phenotypes: Watermark Chart'
    _form: '\Drupal\trpcultivate_phenotypes\Form\TripalCultivatePhenotypesWatermarkSettingsForm'
  requirements:
    _permission: 'administer tripal'

# Configuration: Phenotypes Integration.
trpcultivate_phenotypes.pheno_integration:
  path: 'admin/tripal/extension/tripalcultivate-phenotypes/integration'
  defaults:
    _title: 'Configure Tripal Cultivate Phenotypes: Phenotypes Integration'
    _form: '\Drupal\trpcultivate_phenotypes\Form\PhenoIntegrationSettingsForm'
  requirements:
    _permission: 'administer tripal'

# Configuration: Vocabulary, DB and Terms.
trpcultivate_phenotypes.settings_ontology:
  path: 'admin/tripal/extension/tripal-cultivate/phenotypes/ontology'
  defaults:
    _title: 'Configure Tripal Cultivate Phenotypes: Ontology Terms'
    _form: '\Drupal\trpcultivate_phenotypes\Form\TripalCultivatePhenotypesOntologySettingsForm'
  requirements:
    _permission: 'administer tripal'

# Experiment Configuration Page.
# Phenotypes integration set to pheno_combo.
trpcultivate_phenotypes.experiment_configuration:
  path: '/bio_data/{tripal_entity}/phenotypes/{genus}'
  defaults:
    _title: 'Phenotypes:'
    _form: '\Drupal\trpcultivate_phenotypes\Form\PhenoExperimentConfigurationForm'
    genus: ''
  requirements:
    _permission: 'administer tripal content'
    _pheno_experiment_configuration_access_check: true
    integration: 'pheno_combo'
  options:
    _admin_route: true
    parameters:
      tripal_entity:
        type: 'entity:tripal_entity'

trpcultivate_phenotypes.experiment_traitselector:
  path: '/bio_data/{tripal_entity}/phenotypes/select/{genus}'
  defaults:
    _title: 'Add Trait:'
    _form: '\Drupal\trpcultivate_phenotypes\Form\PhenoExperimentTraitSelectorForm'
    genus: ''
  requirements:
    _permission: 'administer tripal content'
    _pheno_experiment_configuration_access_check: true
    integration: 'pheno_combo'
  options:
    _admin_route: true
    parameters:
      tripal_entity:
        type: 'entity:tripal_entity'

# Experiment Phenotypes Backup.
# Phenotypes integration set to backup.
trpcultivate_phenotypes.experiment_phenobackup:
  path: '/bio_data/{tripal_entity}/phenobackup'
  defaults:
    _title: 'Phenotypes Backup'
    _controller: 'Drupal\trpcultivate_phenotypes\Controller\PhenoExperimentPhenoBackupController::loadBackups'
  requirements:
    _permission: 'administer tripal content'
    _pheno_experiment_configuration_access_check: true
    integration: 'backup'
  options:
    _admin_route: true
    parameters:
      tripal_entity:
        type: 'entity:tripal_entity'

# Phenodata Backup Config Entity Routes:
entity.phenodata_backup.collection:
  path: '/admin/structure/phenodata-backup'
  defaults:
    _entity_list: 'phenodata_backup'
    _title: 'Phenotypic Data Backups'
  requirements:
    _permission: 'administer phenodata_backup+view_all phenodata_backup+view_own phenodata_backup'

entity.phenodata_backup.add_form:
  path: '/admin/structure/phenodata_backup/add'
  defaults:
    _entity_form: 'phenodata_backup.add'
    _title: 'Add a phenotypic data backup'
  requirements:
    _permission: 'administer phenodata_backup+view_all phenodata_backup+view_own phenodata_backup'

entity.phenodata_backup.edit_form:
  path: '/admin/structure/phenodata-backup/{phenodata_backup}'
  defaults:
    _entity_form: 'phenodata_backup.edit'
    _title: 'Edit a phenotypic data backup'
  requirements:
    _permission: 'administer phenodata_backup+view_all phenodata_backup+view_own phenodata_backup'

entity.phenodata_backup.delete_form:
  path: '/admin/structure/phenodata-backup/{phenodata_backup}/delete'
  defaults:
    _entity_form: 'phenodata_backup.delete'
    _title: 'Delete a phenotypic data backup'
  requirements:
    _permission: 'administer phenodata_backup'
